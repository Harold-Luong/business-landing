<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>CoreBrisk — Social card source</title>
    <link rel="stylesheet" href="../src/fonts.css">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            background: #f5f9ef;
            color: #293e33;
            font-family: 'Be Vietnam Pro', sans-serif;
            padding: 63px 72px;
            overflow: hidden;
            position: relative
        }

        .brand {
            font-size: 31px;
            font-weight: 500;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 16px
        }

        .mark {
            display: grid;
            place-items: center;
            background: #dcebcf;
            color: #293e33;
            width: 47px;
            height: 47px;
            border-radius: 6px;
            font-size: 32px;
            letter-spacing: -5px;
            padding-right: 6px
        }

        .brand small {
            display: block;
            font-size: 8px;
            letter-spacing: 4px;
            margin-top: 5px
        }

        h1 {
            font-size: 64px;
            line-height: 1.24;
            font-weight: 400;
            letter-spacing: -2px;
            margin: 54px 0 22px
        }

        h1 span {
            color: #527449
        }

        p {
            font-size: 20px;
            color: #657469
        }

        .badge {
            position: absolute;
            right: 70px;
            bottom: 76px;
            background: #dcebcf;
            color: #293e33;
            padding: 17px 25px;
            border: 1px solid #c6d9b7;
            border-radius: 4px;
            font-size: 17px
        }

        .star {
            position: absolute;
            right: 110px;
            top: 170px;
            font-size: 150px;
            color: #789666;
            font-weight: 400;
            line-height: 1
        }

        .circle {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid #78966622;
            right: -45px;
            top: 85px;
            border-radius: 50%;
            pointer-events: none
        }

        .line {
            position: absolute;
            bottom: 50px;
            left: 72px;
            right: 72px;
            height: 1px;
            background: #dce5d5
        }
    </style>
</head>

<body>
    <div class="circle"></div>
    <div class="brand"><span class="mark">c↗</span><span>CoreBrisk<small>DIGITAL STUDIO</small></span></div>
    <h1>Google Sheets & AppSheet.<br><span>Thiết kế website.</span></h1>
    <p>Tự động hóa · Ứng dụng nội bộ · Website theo yêu cầu</p><span class="star">✳</span><span class="badge">Xem dịch
        vụ và bảng giá ↗</span>
    <div class="line"></div>
</body>

</html>
